server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: app
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${POSTGRES_URL}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  ai:
    model:
      chat: ${AI_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${AI_MODEL:llama3:8b}
          temperature: ${AI_TEMPERATURE:0.2}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4.1-mini}
          temperature: ${AI_TEMPERATURE:0.2}

resumer:
  ai:
    provider: ${AI_PROVIDER:ollama}
    model: ${AI_MODEL:qwen3:latest}
    temperature: ${AI_TEMPERATURE:0.2}
    structured:
      max-attempts: ${AI_STRUCTURED_MAX_ATTEMPTS:2}
      include-last-error-in-retry-prompt: ${AI_STRUCTURED_INCLUDE_LAST_ERROR:true}
      max-error-message-length: ${AI_STRUCTURED_MAX_ERROR_MESSAGE_LENGTH:200}
  auth:
    access:
      secret: ${AUTH_ACCESS_SECRET:local_dev_access_secret_change_me_1234567890}
    refresh:
      secret: ${AUTH_REFRESH_SECRET:local_dev_refresh_secret_change_me_1234567890}
    register:
      code-hash-secret: ${REGISTER_CODE_HASH_SECRET:local_dev_register_secret_change_me_1234567890}
  storage:
    engine: ${STORAGE_ENGINE:local}
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./.local-storage}
      public-base-url: ${STORAGE_LOCAL_PUBLIC_BASE_URL:}
      temp-url-secret: ${STORAGE_LOCAL_TEMP_URL_SECRET:local_temp_url_secret_change_me_12345678901234567890}
      default-ttl: ${STORAGE_LOCAL_DEFAULT_TTL:5m}
