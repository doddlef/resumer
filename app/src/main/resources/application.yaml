server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: app
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${POSTGRES_URL}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  ai:
    model:
      chat: ${AI_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${AI_MODEL:qwen3:latest}
          temperature: ${AI_TEMPERATURE:0.2}

resumer:
  ai:
    provider: ${AI_PROVIDER:ollama}
    model: ${AI_MODEL:qwen3:latest}
    temperature: ${AI_TEMPERATURE:0.2}
    structured:
      max-attempts: ${AI_STRUCTURED_MAX_ATTEMPTS:2}
      include-last-error-in-retry-prompt: ${AI_STRUCTURED_INCLUDE_LAST_ERROR:true}
      max-error-message-length: ${AI_STRUCTURED_MAX_ERROR_MESSAGE_LENGTH:200}
  auth:
    access:
      secret: ${AUTH_ACCESS_SECRET:local_dev_access_secret_change_me_1234567890}
    refresh:
      secret: ${AUTH_REFRESH_SECRET:local_dev_refresh_secret_change_me_1234567890}
    register:
      code-hash-secret: ${REGISTER_CODE_HASH_SECRET:local_dev_register_secret_change_me_1234567890}
  storage:
    engine: ${STORAGE_ENGINE:local}
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./.local-storage}
      public-base-url: ${STORAGE_LOCAL_PUBLIC_BASE_URL:}
      temp-url-secret: ${STORAGE_LOCAL_TEMP_URL_SECRET:local_temp_url_secret_change_me_12345678901234567890}
      default-ttl: ${STORAGE_LOCAL_DEFAULT_TTL:5m}
  resume:
    mq:
      stream-key: ${RESUME_MQ_STREAM_KEY:resumer.resume.analysis.v1}
      dlq-stream-key: ${RESUME_MQ_DLQ_STREAM_KEY:resumer.resume.analysis.v1.dlq}
      stream-max-len: ${RESUME_MQ_STREAM_MAX_LEN:100000}
      dlq-stream-max-len: ${RESUME_MQ_DLQ_STREAM_MAX_LEN:10000}
      group-name: ${RESUME_MQ_GROUP_NAME:resume-analysis-workers}
      consumer-prefix: ${RESUME_MQ_CONSUMER_PREFIX:resume-analysis}
      batch-size: ${RESUME_MQ_BATCH_SIZE:10}
      poll-block-ms: ${RESUME_MQ_POLL_BLOCK_MS:5000}
      reclaim-idle-ms: ${RESUME_MQ_RECLAIM_IDLE_MS:60000}
      reclaim-batch-size: ${RESUME_MQ_RECLAIM_BATCH_SIZE:10}
      max-retry: ${RESUME_MQ_MAX_RETRY:3}
